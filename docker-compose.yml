version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: portmanagement-db-op
    environment:
      POSTGRES_DB: portmanagementdb
      POSTGRES_USER: portapp
      POSTGRES_PASSWORD: PortManagement123!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - portmanagement-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./BackendAPI
      dockerfile: Dockerfile
    container_name: portmanagement-api-op
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=10.9.20.216;Port=5432;Database=portmanagementdb;Username=portapp;Password=PortManagement123!
      - Auth0__Domain=3dl-e-04.eu.auth0.com
      - Auth0__Audience=http://3dl-e-04api
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - portmanagement-network
    restart: unless-stopped
  
  scheduling:
    build:
      context: .
      dockerfile: Scheduling/SchedulingAPI/Dockerfile
    container_name: portmanagement-scheduling-op
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5107
      - BackendAPI__BaseUrl=http://backend:5000
    ports:
      - "5107:5107"
    depends_on:
      - backend
    networks:
      - portmanagement-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: portmanagement-frontend-op
    ports:
      - "5173:80"
    depends_on:
      - backend
      - scheduling
    networks:
      - portmanagement-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  portmanagement-network:
    driver: bridge