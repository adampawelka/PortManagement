name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup VPN and deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 10.9.20.216  # Your server's internal IP
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            # This will be executed on the GitHub runner before SSH
            echo "Setting up VPN on GitHub runner..."
            
            # Install OpenVPN
            sudo apt-get update
            sudo apt-get install -y openvpn
            
            # Create VPN config
            cat > /tmp/deinet.ovpn << 'EOF'
            ${{ secrets.VPN_CONFIG }}
            EOF
            
            # Create auth file
            echo -e "${{ secrets.VPN_USER }}\n${{ secrets.VPN_PASSWORD }}" > /tmp/vpn-auth.txt
            chmod 600 /tmp/vpn-auth.txt
            
            # Start VPN
            sudo openvpn --config /tmp/deinet.ovpn --auth-user-pass /tmp/vpn-auth.txt --daemon
            sleep 15
            
            # Add route to 10.9.0.0/16 network
            sudo route add -net 10.9.0.0/16 gw 10.8.0.1 2>/dev/null || true
            
            # Test connection
            if ! ping -c 1 -W 5 10.9.20.216 &> /dev/null; then
              echo "ERROR: Cannot reach server via VPN"
              exit 1
            fi
            
            echo "VPN connected successfully"
          envs: GITHUB_SHA
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Execute deployment commands
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 10.9.20.216
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            echo "=== Starting Deployment ==="
            
            DEPLOY_PATH="/opt/port-management"
            RELEASE_VERSION="$GITHUB_SHA-$(date +'%Y%m%d-%H%M%S')"
            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_VERSION"
            
            # Create temp dir and clone
            TEMP_DIR="/tmp/deploy-$RELEASE_VERSION"
            mkdir -p "$TEMP_DIR"
            cd "$TEMP_DIR"
            
            echo "Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git .
            git checkout "$GITHUB_SHA"
            
            # Create release directory
            echo "Creating release directory..."
            sudo mkdir -p "$RELEASE_DIR"
            sudo chown -R deploy:deploy "$RELEASE_DIR"
            
            # Copy files
            echo "Copying files..."
            cp -r . "$RELEASE_DIR/"
            
            # Stop services
            echo "Stopping services..."
            sudo systemctl stop portmanagement-backend.service portmanagement-oem.service 2>/dev/null || echo "Services already stopped"
            
            # Update symlink
            echo "Updating current symlink..."
            sudo rm -f "$DEPLOY_PATH/current"
            sudo ln -sf "$RELEASE_DIR" "$DEPLOY_PATH/current"
            
            # Start services
            echo "Starting services..."
            sudo systemctl start portmanagement-backend.service portmanagement-oem.service
            
            # Cleanup
            echo "Cleaning up..."
            rm -rf "$TEMP_DIR"
            
            # Keep last 5 releases
            cd "$DEPLOY_PATH/releases"
            ls -t | tail -n +6 | xargs -I {} sudo rm -rf {} 2>/dev/null || echo "No old releases"
            
            echo "✅ Deployment complete!"
            
            # Show status
            echo ""
            echo "Service Status:"
            sudo systemctl status portmanagement-*.service --no-pager | grep -A1 "portmanagement-" || true