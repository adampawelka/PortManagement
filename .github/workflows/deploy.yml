name: Deploy OEM Module

on:
  push:
    branches: [ main ]
    paths:
      - 'OEM/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Build OEM module
      working-directory: ./OEM
      run: |
        npm ci
        npm run build
    
    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp -r OEM/build deployment/
        cp OEM/package*.json deployment/
        cp OEM/Dockerfile deployment/
        cp OEM/.env.example deployment/
        
        # Create deployment script
        cat > deployment/deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "=== Deploying OEM Module ==="
        
        # Stop existing container
        docker stop portmanagement-oem-op || true
        docker rm portmanagement-oem-op || true
        
        # Build new image
        cd /opt/port-management/oem
        docker build -t portmanagement-oem:latest .
        
        # Run container with environment variables
        docker run -d \
          --name portmanagement-oem-op \
          --network portmanagement-network \
          -p 5161:5161 \
          -e NODE_ENV=production \
          -e PORT=5161 \
          -e MONGODB_URI="$MONGODB_URI" \
          -e JWT_SECRET="$JWT_SECRET" \
          -e CORS_ORIGINS="$CORS_ORIGINS" \
          -e BACKEND_API_URL=http://backend:5000 \
          -e SCHEDULING_API_URL=http://scheduling:5107 \
          --restart unless-stopped \
          portmanagement-oem:latest
        
        echo "OEM module deployed successfully"
        EOF
        
        chmod +x deployment/deploy.sh
        
        tar -czf oem-deployment.tar.gz deployment/
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: 10.9.20.216
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # Set environment variables
          export MONGODB_URI="mongodb://oem_admin:PORTMANAGEMENT3DLE04@10.9.20.216:27017/portoemdb?authSource=admin"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}"
          
          # Create deployment directory
          mkdir -p /opt/port-management/oem
          
          # Extract and deploy
          cd /tmp
          # The deployment package would be transferred here
          # For now, we'll create it from existing code
          
          cd /opt/port-management/oem
          
          # Stop and remove old container
          docker stop portmanagement-oem-op 2>/dev/null || true
          docker rm portmanagement-oem-op 2>/dev/null || true
          
          # Build new image
          docker build -t portmanagement-oem:latest .
          
          # Run new container
          docker run -d \
            --name portmanagement-oem-op \
            -p 5161:5161 \
            -e NODE_ENV=production \
            -e PORT=5161 \
            -e MONGODB_URI="$MONGODB_URI" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e BACKEND_API_URL=http://10.9.20.216:5000 \
            -e SCHEDULING_API_URL=http://10.9.20.216:5107 \
            --restart unless-stopped \
            portmanagement-oem:latest
          
          echo "OEM module deployed!"
          echo "Access at: http://10.9.20.216:5161"