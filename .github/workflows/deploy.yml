name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create deployment archive
        run: |
          # Create archive of everything
          tar -czf /tmp/deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            .
          
          echo "📦 Archive created: $(ls -lh /tmp/deployment.tar.gz)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            echo "Starting deployment..."
            
            # Variables
            DEPLOY_PATH="/opt/port-management"
            RELEASE_VERSION="${{ github.sha }}-$(date +'%Y%m%d-%H%M%S')"
            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_VERSION"
            
            # Stop services
            echo "Stopping services..."
            sudo systemctl stop portmanagement-backend.service portmanagement-oem.service 2>/dev/null || true
            
            # Create release directory
            echo "Creating release directory: $RELEASE_DIR"
            sudo mkdir -p "$RELEASE_DIR"
            sudo chown -R deploy:deploy "$RELEASE_DIR"
            
            # Extract new version
            echo "Extracting new version..."
            cd "$RELEASE_DIR"
            tar -xzf /tmp/deployment.tar.gz
            
            # Update current symlink
            echo "Updating current symlink..."
            sudo rm -f "$DEPLOY_PATH/current"
            sudo ln -sf "$RELEASE_DIR" "$DEPLOY_PATH/current"
            
            # Start services
            echo "▶Starting services..."
            sudo systemctl start portmanagement-postgres.service portmanagement-mongo.service
            sleep 5
            sudo systemctl start portmanagement-backend.service portmanagement-oem.service
            
            # Cleanup old releases
            echo "Cleaning old releases..."
            cd "$DEPLOY_PATH/releases"
            ls -t | tail -n +11 | xargs -I {} sudo rm -rf {} 2>/dev/null || true
            
            # Verify
            echo "Deployment complete!"
            echo ""
            echo "Service status:"
            sudo systemctl status portmanagement-*.service --no-pager | grep -E "(Service|Active)" || true

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/deployment.tar.gz"
          target: "/tmp"