name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create deployment package
        run: |
          RELEASE_VERSION=$(date +'%Y%m%d-%H%M%S')
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          
          # Create simple package
          tar -czf deployment.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.log' \
            .
          
          echo "Package created: deployment.tar.gz"
          ls -lh deployment.tar.gz

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Configuration
            DEPLOY_DIR="/opt/port-management"
            RELEASE_VERSION="${{ env.RELEASE_VERSION }}"
            
            # Create directory structure
            sudo mkdir -p $DEPLOY_DIR/{releases,backups,logs}
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} $DEPLOY_DIR
            
            # Create release directory
            RELEASE_PATH="$DEPLOY_DIR/releases/$RELEASE_VERSION"
            mkdir -p "$RELEASE_PATH"
            
            # Upload and extract (file will be uploaded by the action)
            cd "$RELEASE_PATH"
            
            # Extract the uploaded files (they're in the workspace)
            # The action copies the entire workspace to the server
            
            # Stop existing containers
            cd "$DEPLOY_DIR/current" 2>/dev/null && docker-compose down 2>/dev/null || true
            
            # Update current symlink
            rm -f "$DEPLOY_DIR/current" 2>/dev/null || true
            ln -sfn "$RELEASE_PATH" "$DEPLOY_DIR/current"
            
            # Start services
            cd "$DEPLOY_DIR/current"
            
            # Build and start
            docker-compose up -d --build
            
            echo "Deployment completed!"
            
            # Cleanup old releases
            cd "$DEPLOY_DIR/releases"
            ls -t | tail -n +6 | xargs -I {} rm -rf {} 2>/dev/null || true
            
            echo "Services deployed:"
            docker-compose ps