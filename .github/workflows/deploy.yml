name: Deploy to DEINET Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install OpenVPN and setup VPN
        run: |
          echo "🔐 Setting up VPN connection from GitHub runner..."
          
          # Install OpenVPN
          sudo apt-get update
          sudo apt-get install -y openvpn
          
          # Create VPN configuration file
          cat > /tmp/deinet.ovpn << 'EOF'
          ${{ secrets.VPN_CONFIG }}
          EOF
          
          # Create VPN auth file
          echo -e "${{ secrets.VPN_USER }}\n${{ secrets.VPN_PASSWORD }}" > /tmp/vpn-auth.txt
          chmod 600 /tmp/vpn-auth.txt
          
          # Start VPN connection
          echo "Starting VPN connection..."
          sudo openvpn --config /tmp/deinet.ovpn --auth-user-pass /tmp/vpn-auth.txt --daemon
          
          # Wait for VPN to establish
          echo "Waiting for VPN connection..."
          sleep 15
          
          # Add routes for internal networks
          echo "Adding routes to internal networks..."
          sudo route add -net 10.9.0.0/16 gw 10.8.0.1 2>/dev/null || true
          
          # Test connection to your server
          echo "Testing connection to vs216 server..."
          if ping -c 1 -W 10 10.9.20.216 &> /dev/null; then
            echo "✅ Successfully connected to 10.9.20.216 via VPN"
          else
            echo "❌ Cannot reach 10.9.20.216"
            echo "Current routing table:"
            ip route show
            echo "Current interfaces:"
            ip addr show
            exit 1
          fi

      - name: Setup SSH key
        run: |
          # Create SSH key file
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known_hosts (skip verification)
          ssh-keyscan -H 10.9.20.216 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create and upload deployment package
        run: |
          echo "📦 Creating deployment package..."
          
          # Create archive
          tar -czf /tmp/deployment.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            .
          
          echo "Uploading to server..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa /tmp/deployment.tar.gz deploy@10.9.20.216:/tmp/
          
          echo "✅ Package uploaded"

      - name: Execute deployment on server
        run: |
          set -e
          
          echo "🚀 Executing deployment..."
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy@10.9.20.216 << 'EOF'
            set -e
          
            echo "=== Port Management Deployment on vs216 ==="
            echo "Server: $(hostname)"
            echo "IP: $(hostname -I)"
            echo "Time: $(date)"
          
            # Variables
            DEPLOY_PATH="/opt/port-management"
            RELEASE_VERSION="${{ github.sha }}-$(date +'%Y%m%d-%H%M%S')"
            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_VERSION"
          
            # Create release directory
            echo "Creating release directory: \$RELEASE_DIR"
            sudo mkdir -p "\$RELEASE_DIR"
            sudo chown -R deploy:deploy "\$RELEASE_DIR"
          
            # Extract deployment
            echo "Extracting deployment package..."
            cd "\$RELEASE_DIR"
            tar -xzf /tmp/deployment.tar.gz
          
            # Stop services
            echo "Stopping application services..."
            sudo systemctl stop portmanagement-backend.service portmanagement-oem.service 2>/dev/null || echo "Services already stopped"
          
            # Update current symlink
            echo "Updating current symlink..."
            sudo rm -f "\$DEPLOY_PATH/current"
            sudo ln -sf "\$RELEASE_DIR" "\$DEPLOY_PATH/current"
          
            # Start services
            echo "Starting services..."
            sudo systemctl start portmanagement-backend.service portmanagement-oem.service
          
            # Cleanup old releases (keep last 5)
            echo "Cleaning old releases..."
            cd "\$DEPLOY_PATH/releases"
            ls -t | tail -n +6 | xargs -I {} sudo rm -rf {} 2>/dev/null || echo "No old releases to clean"
          
            # Cleanup temp file
            rm -f /tmp/deployment.tar.gz
          
            echo "✅ Deployment complete!"
            echo ""
            echo "=== Service Status ==="
            for service in portmanagement-backend portmanagement-oem portmanagement-postgres portmanagement-mongo; do
              if sudo systemctl is-active --quiet "\$service"; then
                echo "✅ \$service: RUNNING"
              else
                echo "❌ \$service: NOT RUNNING"
                # Show logs for failed services
                sudo journalctl -u "\$service" -n 10 --no-pager 2>/dev/null | tail -10 || true
              fi
            done
          
            echo ""
            echo "=== Access Information ==="
            echo "Backend API: http://10.9.20.216:5000"
            echo "OEM Module: http://10.9.20.216:5161"
            echo "PostgreSQL: localhost:5432"
            echo "MongoDB: localhost:27017"
          EOF