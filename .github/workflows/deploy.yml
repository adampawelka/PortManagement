name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create package
        run: |
          mkdir -p package
          cp -r OEM package/
          cp -r Frontend package/
          cp -r BackendAPI package/
          tar -czf package.tar.gz package/

      - name: Setup server directory
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /opt/port-management
            chmod 755 /opt/port-management

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "package.tar.gz"
          target: "/opt/port-management"

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/port-management
            
            # Extract package
            tar -xzf package.tar.gz
            
            # Stop old containers
            docker stop portmanagement-oem portmanagement-backend portmanagement-frontend 2>/dev/null || true
            docker rm portmanagement-oem portmanagement-backend portmanagement-frontend 2>/dev/null || true
            
            # Build and run OEM
            cd package/OEM
            docker build -t portmanagement-oem .
            docker run -d \
              --name portmanagement-oem \
              -p 5161:5161 \
              -e MONGODB_URI="mongodb://oem_admin:PORTMANAGEMENT3DLE04@10.9.20.216:27017/portoemdb?authSource=admin" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              portmanagement-oem
            
            echo "OEM deployed on port 5161"