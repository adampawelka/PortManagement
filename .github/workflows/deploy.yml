name: Deploy Port Management System

on:
  push:
    branches: [ main ]

env:
  DEPLOY_PATH: "/opt/port-management"
  DEPLOY_HOST: "10.9.20.216"  # Your server's internal IP
  DEPLOY_USER: "deploy"
  SSH_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e
            
            echo "🚀 Port Management System Deployment"
            echo "===================================="
            echo "Server: $(hostname) ($(hostname -I))"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo ""
            
            # Variables
            DEPLOY_PATH="/opt/port-management"
            RELEASE_VERSION="${{ github.sha }}-$(date +'%Y%m%d-%H%M%S')"
            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_VERSION"
            TEMP_DIR="/tmp/deploy-$RELEASE_VERSION"
            
            echo "📦 Release: $RELEASE_VERSION"
            echo "📁 Release dir: $RELEASE_DIR"
            
            # Create temp directory
            mkdir -p "$TEMP_DIR"
            cd "$TEMP_DIR"
            
            # Clone the repository
            echo "📥 Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git .
            git checkout ${{ github.sha }}
            
            # Create release directory
            echo "📂 Creating release directory..."
            sudo mkdir -p "$RELEASE_DIR"
            sudo chown -R deploy:deploy "$RELEASE_DIR"
            
            # Copy files (exclude unnecessary files)
            echo "📋 Copying files..."
            rsync -av \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.github' \
              --exclude='*.log' \
              . "$RELEASE_DIR/"
            
            # Fix permissions
            sudo chown -R deploy:deploy "$RELEASE_DIR"
            
            # Stop application services
            echo "🛑 Stopping application services..."
            sudo systemctl stop portmanagement-backend.service portmanagement-oem.service 2>/dev/null || echo "Services already stopped or not running"
            
            # Update current symlink
            echo "🔗 Updating current symlink..."
            sudo rm -f "$DEPLOY_PATH/current"
            sudo ln -sf "$RELEASE_DIR" "$DEPLOY_PATH/current"
            
            # Start services
            echo "▶️ Starting services..."
            sudo systemctl start portmanagement-backend.service portmanagement-oem.service
            
            # Wait a bit for services to start
            sleep 5
            
            # Cleanup temp directory
            echo "🧹 Cleaning temp directory..."
            rm -rf "$TEMP_DIR"
            
            # Cleanup old releases (keep last 10)
            echo "🗑️  Cleaning old releases..."
            cd "$DEPLOY_PATH/releases"
            ls -t | tail -n +11 | xargs -I {} sudo rm -rf {} 2>/dev/null || echo "No old releases to clean"
            
            # Verify deployment
            echo ""
            echo "✅ Deployment Complete!"
            echo "======================="
            echo "Current release: $(readlink -f $DEPLOY_PATH/current)"
            echo ""
            
            # Check service status
            echo "📊 Service Status:"
            echo "------------------"
            
            SERVICES=(
              "portmanagement-postgres.service"
              "portmanagement-mongo.service" 
              "portmanagement-backend.service"
              "portmanagement-oem.service"
            )
            
            ALL_OK=true
            for service in "${SERVICES[@]}"; do
              if sudo systemctl is-active --quiet "$service"; then
                echo "✅ $service: RUNNING"
              else
                echo "❌ $service: NOT RUNNING"
                ALL_OK=false
              fi
            done
            
            echo ""
            
            # Show detailed status for any failed services
            if [ "$ALL_OK" = false ]; then
              echo "🔍 Detailed status for failed services:"
              echo "---------------------------------------"
              for service in "${SERVICES[@]}"; do
                if ! sudo systemctl is-active --quiet "$service"; then
                  echo ""
                  echo "Service: $service"
                  sudo systemctl status "$service" --no-pager --lines=10 || true
                fi
              done
            fi
            
            # Show URLs
            echo ""
            echo "🌐 Access URLs:"
            echo "---------------"
            echo "Backend API:    http://$(hostname -I | awk '{print $1}'):5000"
            echo "OEM Module:     http://$(hostname -I | awk '{print $1}'):5161"
            echo "PostgreSQL:     localhost:5432"
            echo "MongoDB:        localhost:27017"
            
            echo ""
            echo "🎉 Deployment successful!"