name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  TEST_PROJECT_PATH: './Tests/DDDNetCore.Tests/DDDNetCore.Tests.csproj'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DDDNetCore.csproj

      - name: Build
        run: dotnet build DDDNetCore.csproj --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults  || true
        continue-on-error: true

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish DDDNetCore.csproj --no-build --configuration Release --output ./publish

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/
